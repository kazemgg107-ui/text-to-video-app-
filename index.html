<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تحويل النص إلى فيديو - NexusCode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: #1e293b; width: 100%; max-width: 500px; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        textarea { width: 100%; height: 100px; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; resize: none; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #1d4ed8; }
        .result-section { margin-top: 25px; text-align: center; }
        .video-preview { width: 100%; height: 220px; background: #0f172a; border: 2px dashed #475569; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #94a3b8; position: relative; overflow: hidden; }
        .loading { display: none; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>مولد الفيديو الذكي</h2>
    
    <label for="promptText">اكتب وصف المشهد أو النص:</label>
    <textarea id="promptText" placeholder="مثال: منظر غروب الشمس على بحر هادئ بجودة عالية..."></textarea>
    
    <button onclick="generateVideo()">توليد الفيديو الآن</button>

    <div class="result-section">
        <label>نتيجة العرض:</label>
        <div class="video-preview" id="videoPreview">
            <span id="placeholderText">الفيديو سيظهر هنا بعد التوليد...</span>
            <div class="loading" id="loadingText">جاري معالجة النص وتوليد الفيديو بالذكاء الاصطناعي... ⏳</div>
        </div>
    </div>
</div>

<script>

        const placeholder = document.getElementById('placeholderText');
        const loading = document.getElementById('loadingText');
        const previewBox = document.getElementById('videoPreview');

            alert('الرجاء كتابة وصف النص أولاً!');
            return;
        }

        loading.style.display = 'block';

        setTimeout(() => {
